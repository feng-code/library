<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="470" viewBox="0 0 1080 470" role="img">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
  </marker>
  <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
    <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
  </filter>
</defs>
<rect class="bg" x="0" y="0" width="1080" height="470"/>

<style>
  .bg { fill: #f8fafc; }
  .title { font: 700 26px 'Noto Sans CJK SC', 'Microsoft YaHei', Arial, sans-serif; fill: #0f172a; }
  .subtitle { font: 500 15px 'Noto Sans CJK SC', 'Microsoft YaHei', Arial, sans-serif; fill: #475569; }
  .box { fill: #ffffff; stroke: #2563eb; stroke-width: 2; rx: 14; ry: 14; filter: url(#shadow); }
  .box-green { fill: #ecfdf5; stroke: #059669; stroke-width: 2; rx: 14; ry: 14; filter: url(#shadow); }
  .box-orange { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; rx: 14; ry: 14; filter: url(#shadow); }
  .box-purple { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; rx: 14; ry: 14; filter: url(#shadow); }
  .box-red { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; rx: 14; ry: 14; filter: url(#shadow); }
  .box-gray { fill: #f1f5f9; stroke: #64748b; stroke-width: 2; rx: 14; ry: 14; filter: url(#shadow); }
  .label { font: 700 18px 'Noto Sans CJK SC', 'Microsoft YaHei', Arial, sans-serif; fill: #0f172a; text-anchor: middle; }
  .small { font: 500 13px 'Noto Sans CJK SC', 'Microsoft YaHei', Arial, sans-serif; fill: #475569; text-anchor: middle; }
  .tiny { font: 500 12px 'Noto Sans CJK SC', 'Microsoft YaHei', Arial, sans-serif; fill: #64748b; text-anchor: middle; }
  .arrow { stroke: #334155; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
  .dash { stroke: #64748b; stroke-width: 2; fill: none; stroke-dasharray: 7 6; marker-end: url(#arrow); }
  .lane { fill: #e2e8f0; stroke: #cbd5e1; stroke-width: 1; rx: 8; ry: 8; }
  .bar-blue { fill: #3b82f6; rx: 5; ry: 5; }
  .bar-green { fill: #10b981; rx: 5; ry: 5; }
  .bar-orange { fill: #f97316; rx: 5; ry: 5; }
</style>

<text class="title" x="540" y="42">CPU 执行模型：取指 → 译码 → 执行 → 写回</text>
<rect class="box-purple" x="50" y="130" width="160" height="100"/>
<text class="label" x="130.0" y="162">PC</text>
<text class="small" x="130.0" y="186">下一条指令地址</text>
<rect class="box" x="270" y="130" width="160" height="100"/>
<text class="label" x="350.0" y="162">Fetch</text>
<text class="small" x="350.0" y="186">从 I-Cache/RAM</text>
<text class="small" x="350.0" y="204">读取机器指令</text>
<rect class="box" x="490" y="130" width="160" height="100"/>
<text class="label" x="570.0" y="162">Decode</text>
<text class="small" x="570.0" y="186">识别操作码</text>
<text class="small" x="570.0" y="204">解析操作数</text>
<rect class="box-green" x="710" y="130" width="160" height="100"/>
<text class="label" x="790.0" y="162">Execute</text>
<text class="small" x="790.0" y="186">ALU / LoadStore</text>
<text class="small" x="790.0" y="204">跳转 / 访存</text>
<rect class="box-orange" x="490" y="310" width="160" height="100"/>
<text class="label" x="570.0" y="342">Registers</text>
<text class="small" x="570.0" y="366">R0..Rn / SP / LR</text>
<text class="small" x="570.0" y="384">保存中间状态</text>
<path class="arrow" d="M 210 180 L 270 180"/>
<path class="arrow" d="M 430 180 L 490 180"/>
<path class="arrow" d="M 650 180 L 710 180"/>
<path class="arrow" d="M 790 230 L 650 310"/>
<path class="dash" d="M 570 310 L 570 230"/>
<path class="arrow" d="M 130 230 L 130 280"/>
<path class="dash" d="M 130 280 L 50 180"/>
<text class="subtitle" x="330" y="285">C 语句 c=a+b 通常会拆成 LOAD、ADD、STORE 等机器动作</text>
</svg>
