<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="395" viewBox="0 0 1080 395" role="img" aria-labelledby="title desc">
<title id="title">DMA + Cache + RTOS：高吞吐接收的典型链路</title>
<desc id="desc">用于图解计算机原理教程的矢量示意图，帮助理解模块关系、数据流和验证层级。</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
  </marker>
  <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
    <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
  </filter>
</defs>
<rect class="bg" x="0" y="0" width="1080" height="395"/>

<style>
  .bg { fill: #f8fafc; }
  .title { font: 700 26px 'Noto Sans CJK SC', 'Microsoft YaHei', Arial, sans-serif; fill: #0f172a; text-anchor: middle; }
  .subtitle { font: 500 15px 'Noto Sans CJK SC', 'Microsoft YaHei', Arial, sans-serif; fill: #475569; text-anchor: middle; }
  .box { fill: #ffffff; stroke: #2563eb; stroke-width: 2; rx: 14; ry: 14; filter: url(#shadow); }
  .box-green { fill: #ecfdf5; stroke: #059669; stroke-width: 2; rx: 14; ry: 14; filter: url(#shadow); }
  .box-orange { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; rx: 14; ry: 14; filter: url(#shadow); }
  .box-purple { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; rx: 14; ry: 14; filter: url(#shadow); }
  .box-red { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; rx: 14; ry: 14; filter: url(#shadow); }
  .box-gray { fill: #f1f5f9; stroke: #64748b; stroke-width: 2; rx: 14; ry: 14; filter: url(#shadow); }
  .label { font: 700 17px 'Noto Sans CJK SC', 'Microsoft YaHei', Arial, sans-serif; fill: #0f172a; text-anchor: middle; }
  .small { font: 500 13px 'Noto Sans CJK SC', 'Microsoft YaHei', Arial, sans-serif; fill: #475569; text-anchor: middle; }
  .tiny { font: 500 12px 'Noto Sans CJK SC', 'Microsoft YaHei', Arial, sans-serif; fill: #64748b; text-anchor: middle; }
  .arrow { stroke: #334155; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
  .dash { stroke: #64748b; stroke-width: 2; fill: none; stroke-dasharray: 7 6; marker-end: url(#arrow); }
</style>

<text class="title" x="540" y="42">DMA + Cache + RTOS：高吞吐接收的典型链路</text>
<text class="subtitle" x="540" y="68">DMA 负责搬运，Cache 影响可见性，任务线程负责复杂解析</text>
<rect class="box-purple" x="65" y="125" width="155" height="98"/>
<text class="label" x="142.5" y="155">UART RX</text>
<text class="small" x="142.5" y="179">字节流</text>
<text class="small" x="142.5" y="196">进入外设</text>
<rect class="box-green" x="285" y="125" width="155" height="98"/>
<text class="label" x="362.5" y="155">DMA</text>
<text class="small" x="362.5" y="179">自动写入</text>
<text class="small" x="362.5" y="196">rx_buffer</text>
<rect class="box-orange" x="505" y="125" width="180" height="98"/>
<text class="label" x="595.0" y="155">RAM Buffer</text>
<text class="small" x="595.0" y="179">环形缓冲</text>
<text class="small" x="595.0" y="196">或双缓冲</text>
<rect class="box-red" x="765" y="85" width="180" height="98"/>
<text class="label" x="855.0" y="115">D-Cache</text>
<text class="small" x="855.0" y="139">CPU 可能</text>
<text class="small" x="855.0" y="156">读到旧数据</text>
<rect class="box" x="765" y="235" width="180" height="98"/>
<text class="label" x="855.0" y="265">协议任务</text>
<text class="small" x="855.0" y="289">队列唤醒后</text>
<text class="small" x="855.0" y="306">解析数据</text>
<path class="arrow" d="M 220 174 L 285 174"/>
<path class="arrow" d="M 440 174 L 505 174"/>
<path class="dash" d="M 685 174 L 765 134"/>
<path class="arrow" d="M 685 190 L 765 284"/>
<text class="subtitle" x="615" y="305">DMA 写 RAM 后，CPU 读取前通常要按平台要求 invalidate cache</text>
<text class="subtitle" x="615" y="335">ISR/DMA 回调只投递事件，复杂协议解析放到任务线程</text>
</svg>
