<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="460" viewBox="0 0 1080 460" role="img" aria-labelledby="title desc">
<title id="title">计算机系统总览：自动化工厂模型</title>
<desc id="desc">用于图解计算机原理教程的矢量示意图，帮助理解模块关系、数据流和验证层级。</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
  </marker>
  <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
    <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
  </filter>
</defs>
<rect class="bg" x="0" y="0" width="1080" height="460"/>

<style>
  .bg { fill: #f8fafc; }
  .title { font: 700 26px 'Noto Sans CJK SC', 'Microsoft YaHei', Arial, sans-serif; fill: #0f172a; text-anchor: middle; }
  .subtitle { font: 500 15px 'Noto Sans CJK SC', 'Microsoft YaHei', Arial, sans-serif; fill: #475569; text-anchor: middle; }
  .box { fill: #ffffff; stroke: #2563eb; stroke-width: 2; rx: 14; ry: 14; filter: url(#shadow); }
  .box-green { fill: #ecfdf5; stroke: #059669; stroke-width: 2; rx: 14; ry: 14; filter: url(#shadow); }
  .box-orange { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; rx: 14; ry: 14; filter: url(#shadow); }
  .box-purple { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; rx: 14; ry: 14; filter: url(#shadow); }
  .box-red { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; rx: 14; ry: 14; filter: url(#shadow); }
  .box-gray { fill: #f1f5f9; stroke: #64748b; stroke-width: 2; rx: 14; ry: 14; filter: url(#shadow); }
  .label { font: 700 17px 'Noto Sans CJK SC', 'Microsoft YaHei', Arial, sans-serif; fill: #0f172a; text-anchor: middle; }
  .small { font: 500 13px 'Noto Sans CJK SC', 'Microsoft YaHei', Arial, sans-serif; fill: #475569; text-anchor: middle; }
  .tiny { font: 500 12px 'Noto Sans CJK SC', 'Microsoft YaHei', Arial, sans-serif; fill: #64748b; text-anchor: middle; }
  .arrow { stroke: #334155; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
  .dash { stroke: #64748b; stroke-width: 2; fill: none; stroke-dasharray: 7 6; marker-end: url(#arrow); }
</style>

<text class="title" x="540" y="42">计算机系统总览：自动化工厂模型</text>
<text class="subtitle" x="540" y="68">程序、数据、指令、总线和外设如何协同完成业务动作</text>
<rect class="box-orange" x="45" y="120" width="200" height="125"/>
<text class="label" x="145.0" y="150">存储仓库</text>
<text class="small" x="145.0" y="174">Flash / SSD</text>
<text class="small" x="145.0" y="191">程序 / 文件 / 固件</text>
<rect class="box-green" x="315" y="120" width="200" height="125"/>
<text class="label" x="415.0" y="150">临时货架</text>
<text class="small" x="415.0" y="174">RAM / Cache</text>
<text class="small" x="415.0" y="191">代码 / 数据 / 栈堆</text>
<rect class="box" x="585" y="120" width="200" height="125"/>
<text class="label" x="685.0" y="150">调度车间</text>
<text class="small" x="685.0" y="174">CPU Core</text>
<text class="small" x="685.0" y="191">取指 / 译码 / 执行</text>
<rect class="box-purple" x="855" y="120" width="190" height="125"/>
<text class="label" x="950.0" y="150">外设窗口</text>
<text class="small" x="950.0" y="174">GPIO / UART / SPI</text>
<text class="small" x="950.0" y="191">屏幕 / 网络 / 传感器</text>
<rect class="box-gray" x="315" y="325" width="470" height="95"/>
<text class="label" x="550.0" y="355">系统道路</text>
<text class="small" x="550.0" y="379">Bus / AXI / AHB / APB</text>
<text class="small" x="550.0" y="396">承载地址 / 数据 / 控制信号</text>
<path class="arrow" d="M 245 182 L 315 182"/>
<path class="arrow" d="M 515 182 L 585 182"/>
<path class="arrow" d="M 785 182 L 855 182"/>
<path class="arrow" d="M 415 245 L 415 325"/>
<path class="arrow" d="M 685 245 L 685 325"/>
<path class="arrow" d="M 855 325 L 785 370"/>
<path class="arrow" d="M 315 370 L 245 225"/>
<text class="tiny" x="280" y="168">加载</text>
<text class="tiny" x="550" y="168">取指 / 读写</text>
<text class="tiny" x="820" y="168">控制 / 反馈</text>
</svg>
