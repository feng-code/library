<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="500" viewBox="0 0 1280 500" role="img" aria-labelledby="title desc">
<title id="title">计算机系统总览：自动化工厂模型</title>
<desc id="desc">用于图解计算机原理教程的矢量示意图。图中为概念模型，箭头表示主要数据流、控制流或验证链路。</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
  </marker>
  <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
    <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
  </filter>
</defs>
<rect class="bg" x="0" y="0" width="1280" height="500"/>

<style>
  .bg { fill: #f8fafc; }
  .title { font: 700 28px 'Noto Sans CJK SC', 'Microsoft YaHei', Arial, sans-serif; fill: #0f172a; text-anchor: middle; }
  .subtitle { font: 500 16px 'Noto Sans CJK SC', 'Microsoft YaHei', Arial, sans-serif; fill: #475569; text-anchor: middle; }
  .box { fill: #ffffff; stroke: #2563eb; stroke-width: 2.2; rx: 16; ry: 16; filter: url(#shadow); }
  .box-green { fill: #ecfdf5; stroke: #059669; stroke-width: 2.2; rx: 16; ry: 16; filter: url(#shadow); }
  .box-orange { fill: #fff7ed; stroke: #ea580c; stroke-width: 2.2; rx: 16; ry: 16; filter: url(#shadow); }
  .box-purple { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2.2; rx: 16; ry: 16; filter: url(#shadow); }
  .box-red { fill: #fef2f2; stroke: #dc2626; stroke-width: 2.2; rx: 16; ry: 16; filter: url(#shadow); }
  .box-gray { fill: #f1f5f9; stroke: #64748b; stroke-width: 2.2; rx: 16; ry: 16; filter: url(#shadow); }
  .label { font: 700 18px 'Noto Sans CJK SC', 'Microsoft YaHei', Arial, sans-serif; fill: #0f172a; text-anchor: middle; }
  .small { font: 500 14px 'Noto Sans CJK SC', 'Microsoft YaHei', Arial, sans-serif; fill: #475569; text-anchor: middle; }
  .tiny { font: 500 12px 'Noto Sans CJK SC', 'Microsoft YaHei', Arial, sans-serif; fill: #64748b; text-anchor: middle; }
  .arrow { stroke: #334155; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
  .dash { stroke: #64748b; stroke-width: 2.2; fill: none; stroke-dasharray: 8 7; marker-end: url(#arrow); }
</style>

<text class="title" x="640.0" y="44">计算机系统总览：自动化工厂模型</text>
<text class="subtitle" x="640.0" y="74">程序、数据、指令、总线和外设如何协同完成业务动作</text>
<rect class="box-orange" x="70" y="125" width="220" height="145"/>
<text class="label" x="180.0" y="159">存储仓库</text>
<text class="small" x="180.0" y="187">Flash / SSD</text>
<text class="small" x="180.0" y="206">程序 / 文件</text>
<text class="small" x="180.0" y="225">固件</text>
<rect class="box-green" x="370" y="125" width="220" height="145"/>
<text class="label" x="480.0" y="159">临时货架</text>
<text class="small" x="480.0" y="187">RAM / Cache</text>
<text class="small" x="480.0" y="206">代码 / 数据</text>
<text class="small" x="480.0" y="225">栈 / 堆</text>
<rect class="box" x="670" y="125" width="220" height="145"/>
<text class="label" x="780.0" y="159">调度车间</text>
<text class="small" x="780.0" y="187">CPU Core</text>
<text class="small" x="780.0" y="206">取指 / 译码</text>
<text class="small" x="780.0" y="225">执行</text>
<rect class="box-purple" x="970" y="125" width="220" height="145"/>
<text class="label" x="1080.0" y="159">外设窗口</text>
<text class="small" x="1080.0" y="187">GPIO / UART</text>
<text class="small" x="1080.0" y="206">SPI / 网络</text>
<text class="small" x="1080.0" y="225">传感器</text>
<rect class="box-gray" x="380" y="350" width="520" height="100"/>
<text class="label" x="640.0" y="384">系统道路</text>
<text class="small" x="640.0" y="412">Bus / AXI / AHB / APB</text>
<text class="small" x="640.0" y="431">承载地址、数据、控制信号</text>
<path class="arrow" d="M 290 197 L 370 197"/>
<path class="arrow" d="M 590 197 L 670 197"/>
<path class="arrow" d="M 890 197 L 970 197"/>
<path class="arrow" d="M 480 270 L 480 350"/>
<path class="arrow" d="M 780 270 L 780 350"/>
<path class="arrow" d="M 970 350 L 900 400"/>
<path class="arrow" d="M 380 400 L 290 245"/>
<text class="tiny" x="330" y="181">加载</text>
<text class="tiny" x="630" y="181">取指 / 读写</text>
<text class="tiny" x="930" y="181">控制 / 反馈</text>
</svg>
