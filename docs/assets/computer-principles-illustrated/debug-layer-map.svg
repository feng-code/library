<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
  </marker>
  <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
    <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
  </filter>
</defs>
<rect class="bg" x="0" y="0" width="1080" height="560"/>

<style>
  .bg { fill: #f8fafc; }
  .title { font: 700 26px 'Noto Sans CJK SC', 'Microsoft YaHei', Arial, sans-serif; fill: #0f172a; }
  .subtitle { font: 500 15px 'Noto Sans CJK SC', 'Microsoft YaHei', Arial, sans-serif; fill: #475569; }
  .box { fill: #ffffff; stroke: #2563eb; stroke-width: 2; rx: 14; ry: 14; filter: url(#shadow); }
  .box-green { fill: #ecfdf5; stroke: #059669; stroke-width: 2; rx: 14; ry: 14; filter: url(#shadow); }
  .box-orange { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; rx: 14; ry: 14; filter: url(#shadow); }
  .box-purple { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; rx: 14; ry: 14; filter: url(#shadow); }
  .box-red { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; rx: 14; ry: 14; filter: url(#shadow); }
  .box-gray { fill: #f1f5f9; stroke: #64748b; stroke-width: 2; rx: 14; ry: 14; filter: url(#shadow); }
  .label { font: 700 18px 'Noto Sans CJK SC', 'Microsoft YaHei', Arial, sans-serif; fill: #0f172a; text-anchor: middle; }
  .small { font: 500 13px 'Noto Sans CJK SC', 'Microsoft YaHei', Arial, sans-serif; fill: #475569; text-anchor: middle; }
  .tiny { font: 500 12px 'Noto Sans CJK SC', 'Microsoft YaHei', Arial, sans-serif; fill: #64748b; text-anchor: middle; }
  .arrow { stroke: #334155; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
  .dash { stroke: #64748b; stroke-width: 2; fill: none; stroke-dasharray: 7 6; marker-end: url(#arrow); }
  .lane { fill: #e2e8f0; stroke: #cbd5e1; stroke-width: 1; rx: 8; ry: 8; }
  .bar-blue { fill: #3b82f6; rx: 5; ry: 5; }
  .bar-green { fill: #10b981; rx: 5; ry: 5; }
  .bar-orange { fill: #f97316; rx: 5; ry: 5; }
</style>

<text class="title" x="540" y="42">调试地图：找到第一个不符合预期的层级</text>
<rect class="box-green" x="360" y="95" width="360" height="48"/>
<text class="label" x="540.0" y="127">复现</text>
<text class="small" x="540.0" y="151">固定输入/版本/环境</text>
<path class="arrow" d="M 540 143 L 540 157"/>
<rect class="box" x="360" y="157" width="360" height="48"/>
<text class="label" x="540.0" y="189">输入</text>
<text class="small" x="540.0" y="213">原始报文/电平/文件</text>
<path class="arrow" d="M 540 205 L 540 219"/>
<rect class="box-green" x="360" y="219" width="360" height="48"/>
<text class="label" x="540.0" y="251">解析</text>
<text class="small" x="540.0" y="275">校验、字段、边界</text>
<path class="arrow" d="M 540 267 L 540 281"/>
<rect class="box" x="360" y="281" width="360" height="48"/>
<text class="label" x="540.0" y="313">状态机</text>
<text class="small" x="540.0" y="337">当前状态是否允许</text>
<path class="arrow" d="M 540 329 L 540 343"/>
<rect class="box-green" x="360" y="343" width="360" height="48"/>
<text class="label" x="540.0" y="375">本地执行</text>
<text class="small" x="540.0" y="399">返回值和状态变化</text>
<path class="arrow" d="M 540 391 L 540 405"/>
<rect class="box" x="360" y="405" width="360" height="48"/>
<text class="label" x="540.0" y="437">外设/系统</text>
<text class="small" x="540.0" y="461">寄存器、波形、反馈</text>
<path class="arrow" d="M 540 453 L 540 467"/>
<rect class="box-green" x="360" y="467" width="360" height="48"/>
<text class="label" x="540.0" y="499">上报确认</text>
<text class="small" x="540.0" y="523">ACK/云端/用户侧</text>
<text class="subtitle" x="210" y="280">不要从头发散</text>
<text class="subtitle" x="210" y="305">只推进一个验证目标</text>
<text class="subtitle" x="870" y="280">日志要回答：</text>
<text class="subtitle" x="870" y="305">输入/状态/返回值/下一步</text>
</svg>
