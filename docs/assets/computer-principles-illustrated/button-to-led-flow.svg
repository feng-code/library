<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="530" viewBox="0 0 1280 530" role="img" aria-labelledby="title desc">
<title id="title">按键点亮 LED：从物理事件到业务结果</title>
<desc id="desc">用于图解计算机原理教程的矢量示意图。图中为概念模型，箭头表示主要数据流、控制流或验证链路。</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
  </marker>
  <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
    <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
  </filter>
</defs>
<rect class="bg" x="0" y="0" width="1280" height="530"/>

<style>
  .bg { fill: #f8fafc; }
  .title { font: 700 28px 'Noto Sans CJK SC', 'Microsoft YaHei', Arial, sans-serif; fill: #0f172a; text-anchor: middle; }
  .subtitle { font: 500 16px 'Noto Sans CJK SC', 'Microsoft YaHei', Arial, sans-serif; fill: #475569; text-anchor: middle; }
  .box { fill: #ffffff; stroke: #2563eb; stroke-width: 2.2; rx: 16; ry: 16; filter: url(#shadow); }
  .box-green { fill: #ecfdf5; stroke: #059669; stroke-width: 2.2; rx: 16; ry: 16; filter: url(#shadow); }
  .box-orange { fill: #fff7ed; stroke: #ea580c; stroke-width: 2.2; rx: 16; ry: 16; filter: url(#shadow); }
  .box-purple { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2.2; rx: 16; ry: 16; filter: url(#shadow); }
  .box-red { fill: #fef2f2; stroke: #dc2626; stroke-width: 2.2; rx: 16; ry: 16; filter: url(#shadow); }
  .box-gray { fill: #f1f5f9; stroke: #64748b; stroke-width: 2.2; rx: 16; ry: 16; filter: url(#shadow); }
  .label { font: 700 18px 'Noto Sans CJK SC', 'Microsoft YaHei', Arial, sans-serif; fill: #0f172a; text-anchor: middle; }
  .small { font: 500 14px 'Noto Sans CJK SC', 'Microsoft YaHei', Arial, sans-serif; fill: #475569; text-anchor: middle; }
  .tiny { font: 500 12px 'Noto Sans CJK SC', 'Microsoft YaHei', Arial, sans-serif; fill: #64748b; text-anchor: middle; }
  .arrow { stroke: #334155; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
  .dash { stroke: #64748b; stroke-width: 2.2; fill: none; stroke-dasharray: 8 7; marker-end: url(#arrow); }
</style>

<text class="title" x="640.0" y="44">按键点亮 LED：从物理事件到业务结果</text>
<text class="subtitle" x="640.0" y="74">每个节点只代表一个成功层级，不能直接等同最终业务成功</text>
<rect class="box-orange" x="90" y="130" width="165" height="130"/>
<text class="label" x="172.5" y="164">按键</text>
<text class="small" x="172.5" y="192">物理电平</text>
<text class="small" x="172.5" y="211">变化</text>
<rect class="box-purple" x="320" y="130" width="165" height="130"/>
<text class="label" x="402.5" y="164">GPIO 输入</text>
<text class="small" x="402.5" y="192">检测边沿</text>
<text class="small" x="402.5" y="211">或电平</text>
<rect class="box-red" x="550" y="130" width="165" height="130"/>
<text class="label" x="632.5" y="164">中断控制器</text>
<text class="small" x="632.5" y="192">NVIC / GIC</text>
<text class="small" x="632.5" y="211">通知 CPU</text>
<rect class="box" x="780" y="130" width="165" height="130"/>
<text class="label" x="862.5" y="164">ISR</text>
<text class="small" x="862.5" y="192">保存现场</text>
<text class="small" x="862.5" y="211">清标志</text>
<text class="small" x="862.5" y="230">投递事件</text>
<rect class="box-green" x="780" y="315" width="165" height="130"/>
<text class="label" x="862.5" y="349">任务 / 状态机</text>
<text class="small" x="862.5" y="377">判断是否</text>
<text class="small" x="862.5" y="396">允许点灯</text>
<rect class="box-purple" x="550" y="315" width="165" height="130"/>
<text class="label" x="632.5" y="349">GPIO 输出</text>
<text class="small" x="632.5" y="377">写寄存器</text>
<text class="small" x="632.5" y="396">改变引脚</text>
<rect class="box-orange" x="320" y="315" width="165" height="130"/>
<text class="label" x="402.5" y="349">LED 发光</text>
<text class="small" x="402.5" y="377">外部电路</text>
<text class="small" x="402.5" y="396">最终响应</text>
<path class="arrow" d="M 255 195 L 320 195"/>
<path class="arrow" d="M 485 195 L 550 195"/>
<path class="arrow" d="M 715 195 L 780 195"/>
<path class="arrow" d="M 862 260 L 862 315"/>
<path class="arrow" d="M 780 380 L 715 380"/>
<path class="arrow" d="M 550 380 L 485 380"/>
<text class="subtitle" x="640.0" y="485">验证要走到引脚电平和外部电路，不要停在日志、ACK 或函数返回值。</text>
</svg>
