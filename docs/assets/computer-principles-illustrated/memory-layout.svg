<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="620" viewBox="0 0 1080 620" role="img" aria-labelledby="title desc">
<title id="title">运行时内存布局：不同区域，不同生命周期</title>
<desc id="desc">用于图解计算机原理教程的矢量示意图，帮助理解模块关系、数据流和验证层级。</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
  </marker>
  <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
    <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.12"/>
  </filter>
</defs>
<rect class="bg" x="0" y="0" width="1080" height="620"/>

<style>
  .bg { fill: #f8fafc; }
  .title { font: 700 26px 'Noto Sans CJK SC', 'Microsoft YaHei', Arial, sans-serif; fill: #0f172a; text-anchor: middle; }
  .subtitle { font: 500 15px 'Noto Sans CJK SC', 'Microsoft YaHei', Arial, sans-serif; fill: #475569; text-anchor: middle; }
  .box { fill: #ffffff; stroke: #2563eb; stroke-width: 2; rx: 14; ry: 14; filter: url(#shadow); }
  .box-green { fill: #ecfdf5; stroke: #059669; stroke-width: 2; rx: 14; ry: 14; filter: url(#shadow); }
  .box-orange { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; rx: 14; ry: 14; filter: url(#shadow); }
  .box-purple { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; rx: 14; ry: 14; filter: url(#shadow); }
  .box-red { fill: #fef2f2; stroke: #dc2626; stroke-width: 2; rx: 14; ry: 14; filter: url(#shadow); }
  .box-gray { fill: #f1f5f9; stroke: #64748b; stroke-width: 2; rx: 14; ry: 14; filter: url(#shadow); }
  .label { font: 700 17px 'Noto Sans CJK SC', 'Microsoft YaHei', Arial, sans-serif; fill: #0f172a; text-anchor: middle; }
  .small { font: 500 13px 'Noto Sans CJK SC', 'Microsoft YaHei', Arial, sans-serif; fill: #475569; text-anchor: middle; }
  .tiny { font: 500 12px 'Noto Sans CJK SC', 'Microsoft YaHei', Arial, sans-serif; fill: #64748b; text-anchor: middle; }
  .arrow { stroke: #334155; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
  .dash { stroke: #64748b; stroke-width: 2; fill: none; stroke-dasharray: 7 6; marker-end: url(#arrow); }
</style>

<text class="title" x="540" y="42">运行时内存布局：不同区域，不同生命周期</text>
<text class="subtitle" x="540" y="68">不同区域对应不同错误模式：栈溢出、堆碎片、全局变量污染、代码跑飞</text>
<rect class="box-red" x="360" y="96" width="360" height="68"/>
<text class="label" x="540.0" y="126">Stack 栈</text>
<text class="small" x="540.0" y="150">局部变量 / 返回地址</text>
<text class="small" x="540.0" y="167">常向低地址增长</text>
<rect class="box-gray" x="360" y="168" width="360" height="68"/>
<text class="label" x="540.0" y="198">Guard / 空闲</text>
<text class="small" x="540.0" y="222">栈堆之间的缓冲</text>
<text class="small" x="540.0" y="239">或保护区</text>
<rect class="box-orange" x="360" y="240" width="360" height="68"/>
<text class="label" x="540.0" y="270">Heap 堆</text>
<text class="small" x="540.0" y="294">malloc / new 动态内存</text>
<text class="small" x="540.0" y="311">常向高地址增长</text>
<rect class="box-green" x="360" y="312" width="360" height="68"/>
<text class="label" x="540.0" y="342">BSS</text>
<text class="small" x="540.0" y="366">未初始化全局/静态变量</text>
<text class="small" x="540.0" y="383">启动时清零</text>
<rect class="box-green" x="360" y="384" width="360" height="68"/>
<text class="label" x="540.0" y="414">Data</text>
<text class="small" x="540.0" y="438">已初始化全局/静态变量</text>
<rect class="box-purple" x="360" y="456" width="360" height="68"/>
<text class="label" x="540.0" y="486">Rodata</text>
<text class="small" x="540.0" y="510">字符串常量 / 只读表</text>
<rect class="box" x="360" y="528" width="360" height="68"/>
<text class="label" x="540.0" y="558">Text</text>
<text class="small" x="540.0" y="582">机器指令 / 代码段</text>
<text class="subtitle" x="285" y="125">高地址</text>
<text class="subtitle" x="285" y="552">低地址</text>
<path class="arrow" d="M 750 150 L 750 108"/>
<text class="small" x="830" y="132">栈向低地址增长</text>
<path class="arrow" d="M 750 300 L 750 350"/>
<text class="small" x="830" y="330">堆向高地址增长</text>
</svg>
